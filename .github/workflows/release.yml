name: Release New Binary
on:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runs-on: ubuntu-24.04
          - goos: linux
            goarch: arm64
            runs-on: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            runs-on: macos-15-intel
          - goos: darwin
            goarch: arm64
            runs-on: macos-14
    env:
      BINARY_VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Install musl toolchain (Linux only)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools linux-libc-dev
          # musl-gcc compiles with -nostdinc and only searches its own sysroot,
          # so it can't see the kernel UAPI headers (linux/*, asm/*) that libusb
          # (pulled in by the `ledger` build tag via zondax/hid) needs. Symlink
          # them into musl's include dir. Arch-agnostic: works on amd64 & arm64.
          MULTIARCH="$(dpkg-architecture -q DEB_HOST_MULTIARCH)"   # e.g. x86_64-linux-gnu
          MUSL_ARCH="${MULTIARCH%-gnu}-musl"                       # e.g. x86_64-linux-musl
          sudo ln -sf /usr/include/linux          "/usr/include/${MUSL_ARCH}/linux"
          sudo ln -sf /usr/include/asm-generic    "/usr/include/${MUSL_ARCH}/asm-generic"
          sudo ln -sf "/usr/include/${MULTIARCH}/asm" "/usr/include/${MUSL_ARCH}/asm"

      - name: Build binary (Linux, static musl)
        if: matrix.goos == 'linux'
        run: |
          GOOS=linux GOARCH=${{ matrix.goarch }} \
          CGO_ENABLED=1 \
          CC=musl-gcc \
          LDFLAGS="-linkmode external -extldflags=-static" \
          VERSION=${{ env.BINARY_VERSION }} make build

      - name: Build binary (macOS)
        if: matrix.goos == 'darwin'
        run: |
          GOOS=darwin GOARCH=${{ matrix.goarch }} \
          CGO_ENABLED=1 \
          VERSION=${{ env.BINARY_VERSION }} make build

      - name: Rename binary
        run: mv ./build/sixd ./build/sixd-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Debug - List contents after build
        run: ls -F ./build/

      - name: Binary Test Version
        run: ./build/sixd-${{ matrix.goos }}-${{ matrix.goarch }} version

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: sixd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./build/sixd-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Attach binaries to GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Debug - List downloaded artifacts
        run: ls -F ./artifacts/

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-to-gcs:
    name: Archive binaries to GCS
    runs-on: ubuntu-latest
    needs: build
    env:
      GCS_BUCKET: ${{ secrets.SIXNET_BINARIES_BUCKET }}
      BINARY_VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Debug - List downloaded artifacts
        run: ls -F ./artifacts/

      - name: Auth GCLOUD
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: ${{ secrets.SIXNET_BINARIES_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload to cloud storage
        uses: "google-github-actions/upload-cloud-storage@v2"
        with:
          path: ./artifacts
          destination: ${{ env.GCS_BUCKET }}/sixd/${{ env.BINARY_VERSION }}/
          process_gcloudignore: false
