name: Release New Binary
on:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runs-on: ubuntu-latest
            container: golang:1.25-alpine
          - goos: linux
            goarch: arm64
            runs-on: ubuntu-24.04-arm
            container: golang:1.25-alpine
          - goos: darwin
            goarch: amd64
            runs-on: macos-13
            container: ""
          - goos: darwin
            goarch: arm64
            runs-on: macos-14
            container: ""
    env:
      BINARY_VERSION: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (Alpine/musl)
        if: matrix.goos == 'linux'
        run: |
          apk update
          apk add --no-cache build-base linux-headers

      - name: Build binary (Linux, static musl)
        if: matrix.goos == 'linux'
        run: |
          GOOS=linux GOARCH=${{ matrix.goarch }} \
          CC=gcc \
          LDFLAGS="-linkmode external -extldflags=-static" \
          VERSION=${{ env.BINARY_VERSION }} make build

      - name: Build binary (macOS)
        if: matrix.goos == 'darwin'
        run: |
          GOOS=darwin GOARCH=${{ matrix.goarch }} \
          VERSION=${{ env.BINARY_VERSION }} make build

      - name: Rename binary
        run: |
          mv ./build/sixd ./build/sixd-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Debug - List contents after build
        run: ls -F ./build/

      - name: Binary Test Version
        run: ./build/sixd-${{ matrix.goos }}-${{ matrix.goarch }} version

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sixd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./build/sixd-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Attach binaries to GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Debug - List downloaded artifacts
        run: ls -F ./artifacts/

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-to-gcs:
    name: Archive binaries to GCS
    runs-on: ubuntu-latest
    needs: build
    env:
      GCS_BUCKET: ${{ secrets.SIXNET_BINARIES_BUCKET }}
      BINARY_VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Debug - List downloaded artifacts
        run: ls -F ./artifacts/

      - name: Auth GCLOUD
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: ${{ secrets.SIXNET_BINARIES_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload to cloud storage
        uses: "google-github-actions/upload-cloud-storage@v2"
        with:
          path: ./artifacts
          destination: ${{ env.GCS_BUCKET }}/sixd/${{ env.BINARY_VERSION }}/
          process_gcloudignore: false
